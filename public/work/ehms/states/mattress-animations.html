  Mattress Mode Animations — Maida 做好的成品，原樣搬進來。

  用途：/work/ehms 的「04 KEY DECISIONS — animation」區塊，由

  ⚠️⚠️ 動畫邏輯一律不改——時序、緩動、座標、狀態機都是調過的。
  唯二的例外是下面這兩處「經 Maida 明確批准」的整合用新增，兩者都不影響
  時序／緩動／座標（比照 components/work/sui-sui/ProcessAnimation.jsx
  當初對 carousel.html 的處理）：

    [批准修改 1／2] play / pause 對外接口（效能）
      這支自己跑一個 rAF 迴圈，原本沒有暫停檢查，捲出畫面外還會一直跑。
      新增：一個 message 監聽器 + 迴圈開關。父頁用 ScrollTrigger 偵測進出
      視窗後 postMessage('play'/'pause')。
      ⚠️ 暫停期間累積的時間會在恢復時補回 start，所以序列不會跳格——
      這是「暫停」的定義，不是改時序。

    [批准修改 2／2] prefers-reduced-motion（無障礙）
      原本完全沒有處理，而 CLAUDE.md 要求每段動效都要實作。
      新增：偵測到就停在第一個狀態的靜止畫面、不啟動迴圈。

  這兩處在下面的程式碼裡都用 [批准修改 N/2] 標出來。除此之外一行未動。
  ============================================================================

        <path transform="translate(13.5 0.5)" d="M 157 7 C 151.8 7 131.42 5.52 122.26 5.02 C 120.09 5.35 113.36 5.42 103.76 3.02 C 94.16 0.62 83.09 5.02 78.76 7.52 C 75.26 8.02 67.86 9.52 66.26 11.52 C 64.66 13.52 58.92 17.35 56.26 19.02 L 47.76 16.52 L 47.76 11.02 C 47.36 5.82 45.92 4.85 45.26 5.02 C 42.42 4.85 36.66 4.42 36.26 4.02 C 35.86 3.62 34.42 4.18 33.76 4.52 L 29.76 0.02 C 28.56 1.22 23.59 4.52 21.26 6.02 C 17.76 4.68 9.56 3.82 4.76 11.02 C -1.24 20.02 -2.74 32.52 7.26 42.02 C 11.59 45.18 23.16 49.72 34.76 42.52 C 38.92 40.35 49.96 37.62 60.76 44.02 C 64.09 47.68 73.26 55.02 83.26 55.02 C 95.76 55.02 110.76 55.02 125.26 51.52 C 125.67 51.24 126.15 50.9 126.7 50.52 M 184.26 4.02 C 182.09 5.18 176.86 7.82 173.26 9.02 C 169.66 10.22 165.76 15.18 164.26 17.52 C 161.26 20.68 153.36 28.72 145.76 35.52 C 139.01 41.55 130.98 47.51 126.7 50.52 M 184.26 4.02 C 180.59 1.85 171.46 -1.78 164.26 1.02 C 162.26 1.52 158.26 3.12 158.26 5.52 C 158.26 7.92 158.26 9.19 158.26 9.52 C 154.26 11.85 145.56 16.92 142.76 18.52 C 139.26 20.52 125.76 23.02 118.76 35.52 C 113.59 33.02 101.56 28.32 94.76 29.52 C 87.96 30.72 75.26 25.69 69.76 23.02 M 184.26 4.02 C 204.62 4.02 244.41 10.35 261.76 13.52 C 265.76 11.92 269.76 13.19 271.26 14.02 C 278.86 18.42 321.76 24.85 342.26 27.52 C 347.92 27.85 359.76 28.32 361.76 27.52 C 363.76 26.72 378.26 19.19 385.26 15.52 C 390.06 13.92 393.26 8.85 394.26 6.52 C 397.06 3.72 398.76 6.02 399.26 7.52 C 397.76 12.69 393.46 24.12 388.26 28.52 C 383.06 32.92 379.42 38.35 378.26 40.52 C 374.26 50.52 366.26 46.69 362.76 43.52 C 355.96 41.12 338.26 41.85 330.26 42.52 C 300.76 49.52 273.76 46.52 267.76 44.52 C 262.96 42.92 253.42 45.19 249.26 46.52 C 242.59 47.19 226.76 48.92 216.76 50.52 C 206.76 52.12 193.92 55.52 188.76 57.02 C 184.92 57.69 174.26 57.52 162.26 51.52 C 150.26 45.52 133.55 48.35 126.7 50.52"/>
        <path transform="translate(4.938 35.485)" d="M 10.06 0.01 C 6.4 -0.15 -0.74 1.01 0.06 7.01 C 0.86 13.01 17.73 13.51 26.06 13.01 L 59.56 11.51 C 61.4 11.51 64.66 10.62 63.06 7.01"/>

    </g>

    <!-- Occupied bed: faded copy + fully visible copy (clipped for the scan) -->
    <g id="body-wrap" opacity="0">
      <use href="#solid-body" opacity="0.3"/>
      <g clip-path="url(#reveal-clip)"><use href="#solid-body"/></g>
    </g>

    <!-- Scan band (Starting) -->
    <g id="band" clip-path="url(#band-clip)" opacity="0">
      <rect id="band-rect" x="0" y="-4" width="80" height="66" fill="url(#band-grad-r)"/>
      <rect id="band-line" x="0" y="-4" width="2" height="66" fill="#5DB073"/>
    </g>

    <!-- Hip pressure hotspot -->
    <g id="hotspot" opacity="0">
      <path id="hs-outer" transform="translate(177 36)" fill="#C90000" fill-opacity="0.3" d="M25.3614 0C37.8149 0 47.6953 7.22998 51 18.6055C45.0698 20.406 33.8023 23.7735 29.0802 23.9697C18.5895 24.4055 9.25305 20.074 0 15.6046C4.05565 5.5902 13.8823 0 25.3614 0Z"/>
      <path id="hs-mid" transform="translate(181 40)" fill="#C90000" fill-opacity="0.3" d="M21.3832 0C31.8832 0 40.2137 6.02321 43 15.5C38 17 28.5 19.8054 24.5186 19.9688C15.6735 20.3319 7.80159 16.7234 0 13C3.41947 4.65713 11.7047 0 21.3832 0Z"/>
      <path id="hs-core" transform="translate(185 44)" fill="#C90000" d="M17.1562 0C25.5807 0 32.2645 5.42064 34.5 13C29.4896 14.339 24.9048 15.7565 19.6719 15.9707C12.5752 16.2611 6.25942 13.9779 0 11C2.74352 4.32753 9.39095 0 17.1562 0Z"/>
    </g>
  </g>
</svg>
</div>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);

  // ---- timing ----
  const GAP = 1000;   // pause between animations (ms)
  const FADE = 250;   // cross-fade at the switch (ms)

  // ---- helpers ----
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const ease = t => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeBack = t => { const c = 1.4; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

  // ---- mattress bars (from Figma: 3 light / 16 dark / 7 light, 25px tall, radius 10) ----
  const LIGHT = '#7FC98E', DARK = '#059374', BASE = 25, BOTTOM = 90;
  const bars = [];
  const specs = [];
  for (let i = 0; i < 3; i++) specs.push({ x: i * 24, w: 22, c: LIGHT });
  for (let i = 0; i < 16; i++) specs.push({ x: 72 + i * 12, w: 10, c: DARK });
  for (let i = 0; i < 7; i++) specs.push({ x: 264 + i * 24, w: 22, c: LIGHT });
  specs.forEach((s, i) => {
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('fill', s.c);
    $('bars').appendChild(p);
    bars.push({ ...s, i, cx: s.x + s.w / 2, el: p });
  });
  const barPath = (x, w, h) => {
    h = Math.max(0, h);
    const r = Math.min(10, w / 2, h), y = BOTTOM - h;
    return `M${x},${BOTTOM}V${y + r}A${r},${r} 0 0 1 ${x + r},${y}H${x + w - r}A${r},${r} 0 0 1 ${x + w},${y + r}V${BOTTOM}Z`;
  };
  const setBars = fn => bars.forEach(b => b.el.setAttribute('d', barPath(b.x, b.w, fn(b))));

  // ---- scene pieces ----
  const show = (id, o) => $(id).setAttribute('opacity', o);
  const reveal = (x) => { $('reveal-rect').setAttribute('x', x); $('reveal-rect').setAttribute('width', Math.max(0, 440 - x)); };
  const reset = () => {
    show('empty-body', 0); show('body-wrap', 0); show('band', 0); show('hotspot', 0);
    reveal(-10);
  };

  // ---- shared pressure-relief motion ----
  // 1) PRELUDE: head/foot large cells drop into a short/tall alternating pattern
  // 2) MOTION: the 8 small cells of the target zone rise and fall, each on its own
  //    slow organic rhythm (irregular, never in lockstep)
  // 3) everything eases back to flat
  const PRELUDE = 800, ALT_START = 900, ALT_END = 5100;
  const RELIEF_DUR = ALT_END + 900;
  const BACK_ZONE = [3, 10];   // first 8 small cells (under the back)
  const HIP_ZONE = [11, 18];   // last 8 small cells (under the hips)
  const LARGE_LOW = 15, SMALL_UP = 29, SMALL_DOWN = 15;
  // gentle in/out envelope for the small-cell motion
  const motionEnv = t => ease(seg(t, ALT_START - 300, ALT_START + 800)) * (1 - ease(seg(t, ALT_END - 800, ALT_END + 300)));
  // per-cell rhythm: two blended sine waves with different periods (ms) and phases
  const RHYTHM = [
    [1500, 0.0, 2300, 1.3], [1700, 2.1, 1900, 0.4], [1350, 4.0, 2600, 2.7], [1850, 1.2, 2100, 5.1],
    [1450, 5.3, 2450, 3.6], [1650, 3.1, 1800, 0.9], [1550, 0.7, 2750, 4.4], [1750, 4.6, 2000, 2.0]
  ];
  const cellWave = (t, k) => {
    const [p1, f1, p2, f2] = RHYTHM[k % RHYTHM.length];
    const x = t - ALT_START;
    return 0.65 * Math.sin(2 * Math.PI * x / p1 + f1) + 0.35 * Math.sin(2 * Math.PI * x / p2 + f2);
  };
  const reliefBars = (t, zone) => {
    const inP = ease(seg(t, 0, PRELUDE));
    const outP = ease(seg(t, ALT_END, RELIEF_DUR - 100));
    const pattern = inP * (1 - outP);
    const env = motionEnv(t);
    const mid = (SMALL_UP + SMALL_DOWN) / 2, amp = (SMALL_UP - SMALL_DOWN) / 2;
    return b => {
      if (b.w > 20) {
        // large cells: left group starts short (0 short, 1 tall, 2 short), right group too (19 short, 20 tall …)
        const k = b.i < 3 ? b.i : b.i - 19;
        return k % 2 === 0 ? lerp(BASE, LARGE_LOW, pattern) : BASE;
      }
      if (b.i >= zone[0] && b.i <= zone[1]) {
        return lerp(BASE, mid + amp * cellWave(t, b.i - zone[0]), env);
      }
      return BASE;
    };
  };

  // ---- the four animations ----
  const ANIMS = [
    { // 無人在床
      name: 'No One in Bed', dur: 4000,
      render(t) {
        const pulse = 0.5 - 0.5 * Math.cos(2 * Math.PI * clamp(t / 4000) * 2);
        show('empty-body', 0.15 + 0.85 * pulse);
        setBars(() => BASE);
      }
    },
    { // 開始中
      name: 'Starting', dur: 4600,
      render(t) {
        show('body-wrap', 1);
        // 1) air cells inflate from the centre outwards
        setBars(b => {
          const d = Math.abs(b.cx - 215) * 1.4;
          return lerp(7, BASE, easeBack(seg(t, d, d + 650)));
        });
        // 2) scan left -> right (body fades behind the band)
        // 3) scan right -> left (body is restored)
        const rect = $('band-rect'), line = $('band-line');
        let bandOp = 0;
        if (t >= 1000 && t < 2800) {
          const x = lerp(-2, 430, ease(seg(t, 1000, 2500)));
          reveal(x);
          rect.setAttribute('x', x - 80); rect.setAttribute('fill', 'url(#band-grad-r)');
          line.setAttribute('x', x - 2);
          bandOp = seg(t, 1000, 1150);
        } else if (t >= 2800) {
          const x = lerp(430, -2, ease(seg(t, 2800, 4300)));
          reveal(x);
          rect.setAttribute('x', x); rect.setAttribute('fill', 'url(#band-grad-l)');
          line.setAttribute('x', x);
          bandOp = 1 - seg(t, 4300, 4600);
        }
        show('band', bandOp);
      }
    },
    { // 背部減壓：頭腳大氣柱先下降成高低交錯，背部 8 支小氣柱輪流起伏
      name: 'Back Pressure Relief', dur: RELIEF_DUR,
      render(t) {
        show('body-wrap', 1);
        setBars(reliefBars(t, BACK_ZONE));
      }
    },
    { // 臀部減壓：同上，但換成臀部 8 支小氣柱輪流起伏，紅點同步跳動
      name: 'Hip Pressure Relief', dur: RELIEF_DUR,
      render(t) {
        show('body-wrap', 1);
        setBars(reliefBars(t, HIP_ZONE));
        const CX = 202;
        // soft breathing pulse that follows the cell motion
        const w = motionEnv(t) * (0.5 - 0.5 * Math.cos(2 * Math.PI * Math.max(0, t - ALT_START + 300) / 1600));
        const appear = ease(seg(t, 0, PRELUDE + 300));
        const out = 1 - ease(seg(t, ALT_END - 300, ALT_END + 700));
        $('hs-core').setAttribute('opacity', 1);
        $('hs-mid').setAttribute('opacity', lerp(0.35, 1, w));
        $('hs-outer').setAttribute('opacity', lerp(0.1, 1, w));
        const s = lerp(0.7, 1, appear) + 0.1 * w;
        $('hotspot').setAttribute('transform', `translate(${CX} 60) scale(${s}) translate(${-CX} -60)`);
        show('hotspot', appear * out);
      }
    }
  ];

  // ---- label ----
  const setLabel = name => {
    const txt = $('label-text');
    txt.textContent = name;
    const w = Math.max(121, Math.ceil(txt.getComputedTextLength()) + 44);
    const bg = $('label-bg');
    bg.setAttribute('width', w);
    bg.setAttribute('x', 544.5 - w / 2);
  };

  // ---- sequencer: A -> 1s -> B -> 1s -> C -> 1s -> D -> 1s -> loop ----
  const CYCLE = ANIMS.reduce((s, a) => s + a.dur + GAP, 0);
  let current = -1, start = null;
  const frame = now => {
    if (start === null) start = now;
    let e = (now - start) % CYCLE, idx = 0;
    while (e >= ANIMS[idx].dur + GAP) { e -= ANIMS[idx].dur + GAP; idx++; }
    const a = ANIMS[idx];
    if (idx !== current) { current = idx; setLabel(a.name); }
    reset();
    a.render(Math.min(e, a.dur));
    // quick fade in at the start, fade out at the end of the 1s gap
    const fadeIn = seg(e, 0, FADE);
    const fadeOut = 1 - seg(e, a.dur + GAP - FADE, a.dur + GAP);
    const o = Math.min(fadeIn, fadeOut);
    $('scene').setAttribute('opacity', o);
    $('label').setAttribute('opacity', o);
    rafId = requestAnimationFrame(frame);   // [批准修改 1/2] 原本是裸的 requestAnimationFrame(frame)，只多存下 id 以便取消
  };

  // ======================================================================
  // [批准修改 1/2] play / pause 對外接口 —— 效能專用，非動畫邏輯
  // 父頁（StateAnimations.jsx）用 ScrollTrigger 偵測進出視窗後
  // postMessage('play' / 'pause')。這裡只負責開關迴圈。
  // ⚠️ 上面的 frame()、ANIMS、所有時序常數與緩動函式完全沒有被碰過。
  // ⚠️ 恢復時把暫停期間的時間補回 start，序列才會從原地接著走而不是跳格。
  //    這是「暫停」本來的意思，不是修改時序。
  // ======================================================================
  let rafId = 0, paused = false, pausedAt = 0;

  const go = () => { if (!rafId && !paused && !REDUCE) rafId = requestAnimationFrame(frame); };

  const pause = () => {
    if (paused) return;
    paused = true;
    pausedAt = performance.now();
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
  };

  const play = () => {
    if (!paused) return;
    paused = false;
    if (start !== null) start += performance.now() - pausedAt; // 補回暫停期間
    go();
  };

  window.addEventListener('message', (e) => {
    if (e.data === 'pause') pause();
    else if (e.data === 'play') play();
  });

  // ======================================================================
  // [批准修改 2/2] prefers-reduced-motion —— 無障礙專用，非動畫邏輯
  // 停在第一個狀態的靜止畫面、不啟動迴圈。
  // ⚠️ 取 t=1000 而不是 t=0：這個狀態的虛線人形是用 cos 做呼吸淡入淡出，
  //    t=0 剛好在波谷（opacity 0.15，幾乎看不見），t=1000 是第一個波峰
  //    （opacity 1）。渲染的是同一個 render()、同一組座標，只是挑一個
  //    讀得出內容的時間點定格。
  // ======================================================================
  const REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const still = () => {
    const a = ANIMS[0];
    setLabel(a.name);
    reset();
    a.render(1000);
    $('scene').setAttribute('opacity', 1);
    $('label').setAttribute('opacity', 1);
  };

  const boot = () => { if (REDUCE) still(); else go(); };
  (document.fonts && document.fonts.ready) ? document.fonts.ready.then(boot) : boot();
})();
</script>
