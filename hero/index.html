<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wander Buddy — Hero</title>
<link rel="stylesheet" href="hero.css">
<style>*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}</style>
</head>
<body>

<!-- ↓↓↓ 從這裡開始複製到你的頁面 ↓↓↓ -->
<section class="wb-hero">
  <div class="wb-plane">

    <!-- 每欄 3 張、各放兩份。順序不要動，也不要只放一份，否則循環會斷 -->
    <div class="wb-col"><div class="wb-track">
      <img src="assets/s1.png" alt="" decoding="async">
      <img src="assets/s3.png" alt="" decoding="async">
      <img src="assets/s4.png" alt="" decoding="async">
      <img src="assets/s1.png" alt="" aria-hidden="true" decoding="async">
      <img src="assets/s3.png" alt="" aria-hidden="true" decoding="async">
      <img src="assets/s4.png" alt="" aria-hidden="true" decoding="async">
    </div></div>

    <div class="wb-col"><div class="wb-track">
      <img src="assets/s5.png" alt="" decoding="async">
      <img src="assets/s2.png" alt="" decoding="async">
      <img src="assets/s1.png" alt="" decoding="async">
      <img src="assets/s5.png" alt="" aria-hidden="true" decoding="async">
      <img src="assets/s2.png" alt="" aria-hidden="true" decoding="async">
      <img src="assets/s1.png" alt="" aria-hidden="true" decoding="async">
    </div></div>

    <div class="wb-col"><div class="wb-track">
      <img src="assets/s3.png" alt="" decoding="async">
      <img src="assets/s4.png" alt="" decoding="async">
      <img src="assets/s2.png" alt="" decoding="async">
      <img src="assets/s3.png" alt="" aria-hidden="true" decoding="async">
      <img src="assets/s4.png" alt="" aria-hidden="true" decoding="async">
      <img src="assets/s2.png" alt="" aria-hidden="true" decoding="async">
    </div></div>

    <div class="wb-col"><div class="wb-track">
      <img src="assets/s2.png" alt="" decoding="async">
      <img src="assets/s1.png" alt="" decoding="async">
      <img src="assets/s5.png" alt="" decoding="async">
      <img src="assets/s2.png" alt="" aria-hidden="true" decoding="async">
      <img src="assets/s1.png" alt="" aria-hidden="true" decoding="async">
      <img src="assets/s5.png" alt="" aria-hidden="true" decoding="async">
    </div></div>

    <div class="wb-col"><div class="wb-track">
      <img src="assets/s4.png" alt="" decoding="async">
      <img src="assets/s5.png" alt="" decoding="async">
      <img src="assets/s3.png" alt="" decoding="async">
      <img src="assets/s4.png" alt="" aria-hidden="true" decoding="async">
      <img src="assets/s5.png" alt="" aria-hidden="true" decoding="async">
      <img src="assets/s3.png" alt="" aria-hidden="true" decoding="async">
    </div></div>

  </div>

  <div class="wb-vignette"></div>
  <div class="wb-scrim"></div>

  <div class="wb-logo"><img src="assets/logo.svg" alt="Wander Buddy"></div>
  <p class="wb-tagline">The city's better with company.</p>
</section>
<!-- ↑↑↑ 複製到這裡結束 ↑↑↑ -->

</body>
</html>
